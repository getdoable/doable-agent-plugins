name: Validate plugin packages

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.25.1
      - name: Validate Cursor manifests against pinned schemas
        env:
          CURSOR_SCHEMA_COMMIT: 1f4e9b59762f5b36764aa45cbc75bc5dbe208ec3
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/cursor/plugins/${CURSOR_SCHEMA_COMMIT}/schemas/plugin.schema.json" \
            --output "${RUNNER_TEMP}/cursor-plugin.schema.json"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/cursor/plugins/${CURSOR_SCHEMA_COMMIT}/schemas/marketplace.schema.json" \
            --output "${RUNNER_TEMP}/cursor-marketplace.schema.json"
          python scripts/validate-cursor-schema.py \
            "${RUNNER_TEMP}/cursor-plugin.schema.json" \
            plugins/doable-trd-context/.cursor-plugin/plugin.json \
            "${RUNNER_TEMP}/cursor-marketplace.schema.json" \
            .cursor-plugin/marketplace.json
